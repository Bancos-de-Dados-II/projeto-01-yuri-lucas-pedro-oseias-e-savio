<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ComunidadesPB - Gestão de Comunidades</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <!-- PAINEL ESQUERDO -->

    <aside class="sidebar">

        <h2>ComunidadesPB</h2>

        <input
            type="text"
            id="busca"
            placeholder="Pesquisar município..." />

        <div class="filtros">

            <h3>Filtro por Comunidades</h3>

            <select id="filtroComunidades">

                <option value="0">Todas</option>
                <option value="5">Mais de 5</option>
                <option value="10">Mais de 10</option>
                <option value="20">Mais de 20</option>
                <option value="30">Mais de 30</option>

            </select>

        </div>

        <button id="btnLocalizacao">
            Minha Localização
        </button>

        <div id="estatisticas">

            Carregando estatísticas...

        </div>

        <h3>Municípios</h3>

        <div id="listaMunicipios"></div>

    </aside>

    <!-- MAPA -->

    <main>

        <div id="map"></div>

    </main>

    <!-- PAINEL DIREITO -->

    <aside class="info-panel">

        <h2>Informações da Comunidade</h2>

        <div id="dadosMunicipio">

            <p>
                Clique em um município para visualizar os dados.
            </p>

        </div>

        <canvas id="graficoMunicipio"></canvas>

    </aside>

    <!-- LEAFLET -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- GEOCODER -->

    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <!-- SCRIPT PRINCIPAL -->

    <script src="script.js"></script>

</body>

</html>
